name: Tests

# Runs on every pull request, and first in the APK and web deploy workflows,
# so a failing test stops both.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Syntax check
        run: for f in *.js scripts/*.mjs tests/*.mjs; do node --check "$f"; done

      - name: Unit tests
        run: npm test

      - name: Database tests
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run test:db
