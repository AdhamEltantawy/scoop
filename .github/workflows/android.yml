name: Android APK

# Releases are deliberate: push a tag such as v1.2.0 to test, build and
# publish an APK. A manual run (Actions → Android APK → Run workflow) tests
# and builds one as a workflow artifact without publishing it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app and sync into Android project
        run: |
          npm ci
          npm run android:sync

      # Releases are signed only with the private key in the
      # SCOOP_KEYSTORE_BASE64 and SCOOP_KEYSTORE_PASSWORD repository secrets.
      # Without them the build stops here.
      - name: Load private signing key
        env:
          KEYSTORE_B64: ${{ secrets.SCOOP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SCOOP_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the SCOOP_KEYSTORE_BASE64 and SCOOP_KEYSTORE_PASSWORD repository secrets (see README, Signing)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/scoop.keystore"
          echo "SCOOP_KEYSTORE=$RUNNER_TEMP/scoop.keystore" >> "$GITHUB_ENV"
          echo "SCOOP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SCOOP_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      # versionCode is this workflow's run number, so every build installs as
      # an upgrade. A tag v1.2.0 becomes versionName 1.2.0.
      - name: Build APK
        working-directory: android
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} ${VERSION_NAME:+-PversionName=${VERSION_NAME#v}} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/scoop.apk"
          sha256sum "$GITHUB_WORKSPACE/scoop.apk" | cut -d' ' -f1 > "$GITHUB_WORKSPACE/scoop.apk.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoop-apk
          path: |
            scoop.apk
            scoop.apk.sha256

  # Publish to a GitHub Release so the APK can be downloaded straight from
  # your phone's browser (Releases → latest → scoop.apk). Only tag pushes, and
  # only this job can write to the repository.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scoop-apk

      - name: Read checksum
        run: echo "APK_SHA256=$(cat scoop.apk.sha256)" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Scoop ${{ github.ref_name }}
          make_latest: true
          files: scoop.apk
          body: |
            Download **scoop.apk** below on your Android phone and open it to install.
            Built from ${{ github.sha }}.

            SHA-256 of scoop.apk: `${{ env.APK_SHA256 }}`
